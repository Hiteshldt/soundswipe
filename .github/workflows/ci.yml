name: macOS build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Build universal preview
        run: ./scripts/build.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: SoundSwipe-preview-universal
          path: dist/SoundSwipe.zip

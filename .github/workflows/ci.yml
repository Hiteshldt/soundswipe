name: macOS build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Test
        run: ./scripts/test.sh
      - name: Test browser audio engine
        run: node --test Tests/browser-extension/audio-engine.test.mjs
      - name: Build universal preview
        run: ./scripts/build.sh --universal
      - uses: actions/upload-artifact@v7
        with:
          name: SoundSwipe-preview-universal
          path: |
            dist/SoundSwipe.dmg
            dist/SoundSwipe.dmg.sha256
            dist/SoundSwipe.zip
            dist/SoundSwipe.zip.sha256
            dist/SoundSwipe-Tabs.zip
            dist/SoundSwipe-Tabs.zip.sha256

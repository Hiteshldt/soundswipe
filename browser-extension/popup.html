<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoundSwipe Tabs</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><h1>SoundSwipe Tabs</h1><p>A little more control over your tabs.</p></header>
  <section id="active"><p id="active-title"></p><button id="start" disabled>Control this tab</button></section>
  <p id="error" role="alert" hidden></p>
  <main id="sessions" aria-label="Controlled tabs"></main>
  <p id="empty">Open a tab playing audio, then choose “Control this tab”. Repeat in a second tab to control both.</p>
  <footer>Audio stays in Chrome. Nothing is recorded.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
